name: Hub gates (reusable)

# EVERY REPO'S GATE WIRING, IN ONE PLACE.
#
# The gates themselves were never forked — they take `--repo ../app` so a
# sibling runs the hub's copy rather than its own. But the WORKFLOW that calls
# them was copied into eight repos by hand, and drifted exactly the way a
# forked file does: four siblings run five hub gates, three run three of them,
# and nothing records why. The gate was shared and the wiring was not, so the
# question "which gates does this repo run" had eight answers.
#
# A sibling now calls this instead of copying it:
#
#     jobs:
#       hub-gates:
#         uses: njefferson/noahjefferson/.github/workflows/hub-gates.yml@<sha>
#         with:
#           pwa: true
#
# The inputs are the only thing a caller declares, and each names a FACT about
# the repo rather than a preference: `pwa` for a repo with a service worker,
# `mirror` for one carrying its own offline copy of the disclosure patterns,
# `docs-path` for one whose prose is not at the root. A repo that has the fact
# and leaves the input off is running a smaller gate than it looks like it is,
# which is the drift this file exists to end — so the flag is a description,
# never a way to switch a failing gate off.
#
# Adding a gate here adds it to every repo that has bumped its pin. Removing
# one removes it everywhere. There is one answer again.

on:
  workflow_call:
    inputs:
      node-version:
        description: Node version the gates run under.
        type: string
        default: '22'
      pwa:
        description: Run pwa-check — for any repo with a service worker.
        type: boolean
        default: false
      mirror:
        description: >-
          Run privacy-mirror-check — for a repo that must fail `npm test`
          OFFLINE and therefore carries its own copy of the disclosure
          patterns. That copy is a liability the moment the canon moves, and
          a stale mirror is not a smaller gate, it is a DIFFERENT one.
        type: boolean
        default: false
      third-person:
        description: >-
          Run third-person-check — the privacy rule's third half. Defaults ON,
          because every repo in the family passes it and a repo that could opt
          out of a privacy gate would.
        type: boolean
        default: true
      docs-path:
        description: Which directory docs-check walks, relative to the repo.
        type: string
        default: '.'
      palette-path:
        description: >-
          The palette JSON to hold to the colour floors, relative to the repo
          (e.g. palettes/molebridge.json). Empty skips the gate.
        type: string
        default: ''
      textsize-paths:
        description: >-
          Space-separated CSS/HTML paths to check for a reader who enlarges only
          their default text size. Empty skips the gate.
        type: string
        default: ''
      zizmor:
        description: >-
          Audit the caller's own workflows with zizmor, at the version and hash
          the hub pins. Opt-in only while three repos still carry findings —
          see REPOS.md, which names them and what each owes.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # The CALLING repo. In a reusable workflow, a bare checkout takes the
      # caller, which is what is being gated.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false

      # The hub, at EXACTLY the version of this file the caller pinned.
      # github.workflow_ref is
      #   njefferson/noahjefferson/.github/workflows/hub-gates.yml@<ref>
      # so the ref after the @ is the pin the caller wrote. Taking it from
      # there rather than from an input means the gates and the wiring can
      # never be two different versions, and a caller cannot half-bump.
      - name: Work out which hub this call pinned
        id: hub
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          REF="${WORKFLOW_REF##*@}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Gates will be run from the hub at: $REF"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: njefferson/noahjefferson
          ref: ${{ steps.hub.outputs.ref }}
          path: hub
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      # --artefact, never the plain check and never --install. The plain check
      # asserts .git/hooks/pre-commit is installed, which is a fact about ONE
      # CLONE, and actions/checkout leaves .git/hooks empty by definition —
      # Quietkeep's Spine ran the plain check and never once went green.
      # --install would WRITE the tracked file and repair the drift the step
      # exists to find.
      - name: Branch guard (artefact only)
        run: node hub/branch-guard.mjs --repo app --artefact

      - name: The owner's person is not repo material
        run: node hub/privacy-check.mjs --repo app

      - name: An offline copy of the patterns has not drifted from the canon
        if: inputs.mirror
        run: node hub/privacy-mirror-check.mjs --repo app

      - name: Every set-apart quotation says whose words it is
        run: node hub/quote-check.mjs --repo app

      # The pattern is a bare `he|his|him` and it is blunt ON PURPOSE — a
      # narrower one cannot see an attribution that carries no name, which is
      # the whole half of the rule this gate covers. What makes a blunt pattern
      # usable is `.third-person-allow`: a DECLARED list, checked both ways, so
      # a scrub cannot quietly un-cover a file by leaving a stale line in it.
      # `he` is helium in a chemistry app and a runway's high end in an
      # aeronautical one; neither is a reason to weaken the pattern.
      - name: Nothing is attributed to the owner in the third person
        if: inputs.third-person
        run: node hub/third-person-check.mjs --repo app

      # Through the environment, not interpolated into the command: an input
      # expanded straight into a `run:` block is code injection, and zizmor
      # said so on the first run of this file. The env route is the same one
      # the workflow_ref step above already takes.
      - name: No tables or grids in anything the owner reads
        env:
          DOCS_PATH: ${{ inputs.docs-path }}
        run: node hub/docs-check.mjs "app/$DOCS_PATH"

      - name: npm hygiene
        run: node hub/pin-check.mjs --repo app

      - name: The new version waits and says so
        if: inputs.pwa
        run: node hub/pwa-check.mjs --repo app

      - name: Every colour clears every hard floor, in both modes
        if: inputs.palette-path != ''
        env:
          PALETTE_PATH: ${{ inputs.palette-path }}
        working-directory: app
        run: node ../hub/palette-check.mjs "$PALETTE_PATH"

      # A reader who enlarges only their DEFAULT TEXT SIZE and not the page.
      - name: Text set larger than the default still fits
        if: inputs.textsize-paths != ''
        env:
          TEXTSIZE_PATHS: ${{ inputs.textsize-paths }}
        working-directory: app
        # Deliberately unquoted: the input is a space-separated LIST of paths.
        run: node ../hub/scripts/check-textsize.mjs $TEXTSIZE_PATHS

      # PINNED BY VERSION AND HASH IN THE HUB, so every repo audits with the
      # same build. `pip install zizmor` floats on whatever PyPI served that
      # morning, which is the same mutable-pointer problem as an unpinned tag.
      - name: Install zizmor, at the hub's pin
        if: inputs.zizmor
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --only-binary=:all: \
            --require-hashes -r hub/.github/requirements-ci.txt

      # --strict-collection is not optional. Without it an unparseable workflow
      # is logged, skipped, and the audit still exits 0 with "No findings" — the
      # file most likely to be wrong is the one excused.
      - name: Workflow security audit
        if: inputs.zizmor
        run: |
          "$RUNNER_TEMP/zizmor/bin/zizmor" --offline --strict-collection \
            app/.github/workflows/

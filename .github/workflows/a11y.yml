name: Accessibility gate

# Doctrine §4 requires a CI gate that EXITS NON-ZERO on any accessibility
# failure. Until 2026-07-28 no workflow ran the checks at all, and the checks
# themselves exited 0 regardless — §4 described enforcement that did not exist.
# This is that enforcement.
#
# It runs on pull_request too, because before this the repo had NO
# pull_request-triggered workflow: a PR into main ran zero checks.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. Leaving the token in .git/config makes
          # it available to every later step, including whatever action gets
          # added next year (Doctrine §16.4). zizmor: artipacked.
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      # npm ci, never npm install (Doctrine §16.1) — the lockfile is the pin.
      - run: npm ci

      # The sandbox Chromium at /opt/pw-browsers does not exist on a runner, so
      # playwright-core downloads the revision it is pinned to. Same browser
      # build either way; a11y-gate.mjs detects which is present.
      - run: npx --no-install playwright-core install --with-deps chromium

      - run: node a11y-gate.mjs --verbose

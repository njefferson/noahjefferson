name: Deploy MyFax

# The hub holds the family's Cloudflare credentials, so it deploys MyFax:
# checks out njefferson/MyFax at the chosen branch and pushes the PWA to
# Cloudflare Pages (staging -> staging.myfax.pages.dev preview,
# main -> myfax.pages.dev production) plus the relay Worker.
#
# Worker RUNTIME secrets (FAXDROP key, SENDER_EMAIL, ACCESS_CODE) are pushed
# only if the hub also has them as repo secrets; wrangler keeps previously-set
# Worker secrets across deploys, so once set they stick. fax_key picks which
# FaxDrop key (FAXDROP_TEST_API_KEY sandbox / FAXDROP_API_KEY live) becomes
# the Worker's FAXDROP_API_KEY.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "MyFax branch to deploy"
        type: choice
        options: [staging, main]
        default: staging
      fax_key:
        description: "FaxDrop key to push to the Worker (test = sandbox, no real faxes)"
        type: choice
        options: [test, live, skip]
        default: test

concurrency:
  group: deploy-myfax
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: njefferson/MyFax
          ref: ${{ inputs.branch }}

      - name: Prepare Cloudflare credentials
        id: cf
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Strip whitespace/newlines that sneak in when a secret is pasted —
          # a trailing newline corrupts the Authorization header (Cloudflare 6111).
          TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$ACCOUNT"
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "Hub Cloudflare secrets missing - cannot deploy." >&2
            exit 1
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "account=$ACCOUNT" >> "$GITHUB_OUTPUT"

      - name: Ensure Pages project exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cf.outputs.token }}
          accountId: ${{ steps.cf.outputs.account }}
          command: pages project create myfax --production-branch=main

      - name: Deploy PWA to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cf.outputs.token }}
          accountId: ${{ steps.cf.outputs.account }}
          command: pages deploy public --project-name=myfax --branch=${{ inputs.branch }} --commit-dirty=true

      - name: Deploy relay Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ steps.cf.outputs.token }}
          accountId: ${{ steps.cf.outputs.account }}
          workingDirectory: worker
          command: deploy

      - name: Push Worker runtime secrets (only those the hub has)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.cf.outputs.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account }}
          FAX_TEST: ${{ secrets.FAXDROP_TEST_API_KEY }}
          FAX_LIVE: ${{ secrets.FAXDROP_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
          KEY_CHOICE: ${{ inputs.fax_key }}
        run: |
          put () {
            NAME="$1"; VAL="$2"
            if [ -n "$VAL" ]; then
              printf '%s' "$VAL" | npx wrangler secret put "$NAME" && echo "pushed $NAME"
            else
              echo "hub has no value for $NAME - Worker keeps whatever it already has"
            fi
          }
          case "$KEY_CHOICE" in
            test) put FAXDROP_API_KEY "$FAX_TEST" ;;
            live) put FAXDROP_API_KEY "$FAX_LIVE" ;;
            skip) echo "fax_key=skip - FAXDROP_API_KEY left untouched" ;;
          esac
          put SENDER_EMAIL "$SENDER_EMAIL"
          put ACCESS_CODE "$ACCESS_CODE"

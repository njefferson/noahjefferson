name: Deploy MyFax

# The hub holds the family's Cloudflare credentials, so it deploys MyFax:
# checks out njefferson/MyFax at the chosen branch and pushes the PWA to
# Cloudflare Pages (staging -> staging.myfax.pages.dev preview,
# main -> myfax.pages.dev production) plus the relay Worker.
#
# Tokens: CLOUDFLARE_API_TOKEN (Pages-scoped, the hub's long-standing one)
# deploys the PWA; CLOUDFLARE_WORKER_API_TOKEN (Workers Scripts: Edit only)
# deploys the relay Worker. Worker steps skip cleanly until that second
# token exists as a hub secret.
#
# Worker RUNTIME secrets (FAXDROP key, SENDER_EMAIL, ACCESS_CODE) are pushed
# only if the hub also has them as repo secrets; wrangler keeps previously-set
# Worker secrets across deploys, so once set they stick. fax_key picks which
# FaxDrop key (FAXDROP_TEST_API_KEY sandbox / FAXDROP_API_KEY live) becomes
# the Worker's FAXDROP_API_KEY.
#
# Actions are SHA-pinned and wrangler is version-pinned (Doctrine §16.1/§16.2)
# — this job hands live credentials to whatever it executes.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "MyFax branch to deploy"
        type: choice
        options: [staging, main]
        default: staging
      fax_key:
        description: "FaxDrop key to push to the Worker (test = sandbox, no real faxes)"
        type: choice
        options: [test, live, skip]
        default: test
      confirm_live:
        description: "Only for fax_key=live: type LIVE to confirm real faxes"
        type: string
        default: ""

concurrency:
  group: deploy-myfax
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Doctrine §16.2 — never an unpinned fetch next to a secret. This wrangler is
  # handed the live FaxDrop key on stdin, so the version is fixed rather than
  # "whatever npm serves at dispatch time".
  WRANGLER_VERSION: "4.114.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Doctrine §16.5 — friction in proportion to damage. `live` sends real
      # faxes and sat one dropdown position from `test`. This refuses early,
      # before anything is checked out or deployed.
      - name: Confirm a live run was meant
        if: inputs.fax_key == 'live'
        run: |
          if [ "${{ inputs.confirm_live }}" != "LIVE" ]; then
            echo "fax_key=live sends REAL faxes." >&2
            echo "Re-run and type LIVE in the confirm_live box to proceed." >&2
            exit 1
          fi
          echo "Live run confirmed."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: njefferson/MyFax
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - name: Prepare Cloudflare credentials
        id: cf
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_WORKER_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Strip whitespace/newlines that sneak in when a secret is pasted —
          # a trailing newline corrupts the Authorization header (Cloudflare 6111).
          # Two tokens by design: the long-standing hub token
          # stays Pages-only; the Worker deploys with its own Workers-scoped token.
          TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          WTOKEN=$(printf '%s' "$RAW_WORKER_TOKEN" | tr -d '[:space:]')
          ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$WTOKEN"
          echo "::add-mask::$ACCOUNT"
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "Hub Cloudflare secrets missing - cannot deploy." >&2
            exit 1
          fi
          if [ -n "$WTOKEN" ]; then
            echo "worker_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "worker_ready=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_WORKER_API_TOKEN not set - Pages will deploy, Worker steps will be skipped."
          fi
          # Doctrine §16.4: cleaned values go to the job environment, never to
          # step outputs — outputs persist in the run's stored output and are
          # readable through the API. Only the non-secret readiness flag is an
          # output. The two tokens stay in separate variables so the Pages token
          # is never in scope for a Worker step, or the reverse.
          echo "CF_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CF_WORKER_TOKEN=$WTOKEN" >> "$GITHUB_ENV"
          echo "CF_ACCOUNT=$ACCOUNT" >> "$GITHUB_ENV"

      - name: Ensure Pages project exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ env.CF_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages project create myfax --production-branch=main

      - name: Deploy PWA to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ env.CF_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: pages deploy public --project-name=myfax --branch=${{ inputs.branch }} --commit-dirty=true

      - name: Deploy relay Worker
        if: steps.cf.outputs.worker_ready == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ env.CF_WORKER_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: worker
          command: deploy

      - name: Push Worker runtime secrets (only those the hub has)
        if: steps.cf.outputs.worker_ready == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
          FAX_TEST: ${{ secrets.FAXDROP_TEST_API_KEY }}
          FAX_LIVE: ${{ secrets.FAXDROP_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
          KEY_CHOICE: ${{ inputs.fax_key }}
        run: |
          # Pinned: this receives a live API key on stdin. Bare `npx wrangler`
          # resolved whatever npm served at dispatch time (Doctrine §16.2).
          WR="npx --yes wrangler@${WRANGLER_VERSION}"
          put () {
            NAME="$1"; VAL="$2"
            if [ -n "$VAL" ]; then
              printf '%s' "$VAL" | $WR secret put "$NAME" && echo "pushed $NAME"
            else
              echo "hub has no value for $NAME - Worker keeps whatever it already has"
            fi
          }
          case "$KEY_CHOICE" in
            test) put FAXDROP_API_KEY "$FAX_TEST" ;;
            live) put FAXDROP_API_KEY "$FAX_LIVE" ;;
            skip) echo "fax_key=skip - FAXDROP_API_KEY left untouched" ;;
          esac
          put SENDER_EMAIL "$SENDER_EMAIL"
          put ACCESS_CODE "$ACCESS_CODE"

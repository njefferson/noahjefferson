name: Cloudflare analytics

# Manual only — this reports, it does not deploy or change anything.
#
# Answers "which app, from which country" from the account-scoped GraphQL API.
# That data is counted at Cloudflare's edge from requests it already serves, so
# nothing is injected into any app and Doctrine §1's "no analytics" holds. The
# alternative (Cloudflare Web Analytics) is a JS beacon and would break it.
#
# Needs two repo secrets: CLOUDFLARE_ANALYTICS_TOKEN (scoped Account Analytics:
# Read — the Pages deploy token will NOT work) and the existing
# CLOUDFLARE_ACCOUNT_ID.
#
# Run `datasets` first, then `fields` on the dataset it names, then `report`
# with the two field names that come back. The script introspects rather than
# assuming a schema, so those two steps take about a minute and remove the
# guesswork (LESSONS.md §9).
#
# Actions are pinned by SHA, not tag (Doctrine §16.1) — same pins as the other
# workflows here.

on:
  workflow_dispatch:
    inputs:
      command:
        description: Which step
        type: choice
        default: datasets
        options: [datasets, fields, report, top-ips, calibrate, people]
      source:
        description: requestSource filter (report only). eyeball = end users, matches the dashboard; all = include Worker/cache traffic
        type: string
        required: false
        default: eyeball
      host:
        description: Limit to one hostname (top-ips only), e.g. quietkeep.pages.dev
        type: string
        required: false
      dataset:
        description: Dataset name (needed for fields and report)
        type: string
        required: false
      host_field:
        description: Host dimension, from `fields` (report only)
        type: string
        required: false
      country_field:
        description: Country dimension, from `fields` (report only)
        type: string
        required: false
      days:
        description: Days to cover (report only)
        type: string
        default: '7'
      exclude_ip:
        description: Comma-separated IPs to exclude (report only). The run prints how much this drops.
        type: string
        required: false
        default: '185.177.72.22'

permissions:
  contents: read

concurrency:
  group: cf-analytics
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # This workflow reads analytics and pushes nothing (verified: no git
          # push, no commit anywhere in the file), so the checkout token has no
          # job to do after clone. Leaving it in .git/config hands it to every
          # later step in a job that also holds two Cloudflare tokens.
          # zizmor: artipacked. One line, no behaviour change — unlike the
          # template-injection fixes in the same file, which are deferred.
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Prepare Cloudflare credentials
        id: cf
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Strip whitespace/newlines that sneak in when a secret is pasted — a
          # trailing newline corrupts the Authorization header (Cloudflare 6111).
          TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          ACCOUNT=$(printf '%s' "$RAW_ACCOUNT" | tr -d '[:space:]')
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$ACCOUNT"
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "Missing CLOUDFLARE_ANALYTICS_TOKEN or CLOUDFLARE_ACCOUNT_ID." >&2
            exit 1
          fi
          # Doctrine §16.4: cleaned values go to the job environment, never to
          # step outputs — outputs persist in the run and are readable via API.
          echo "CLOUDFLARE_ANALYTICS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"

      - name: Describe the credentials without printing them
        run: |
          # Two rejected tokens in a row means guessing at the cause is costing
          # more than measuring it. Length and character class identify which
          # credential was pasted without ever revealing it — the same trade
          # deploy.yml already makes when it echoes the cleaned token length.
          # Report composition only. The previous version keyed every branch on
          # length against an ASSUMED 40-character token, so a 53-character
          # value fell through to a verdict that was not evidence. Character
          # census answers "what kind of string is this" without assuming what
          # Cloudflare's format is.
          t="$CLOUDFLARE_ANALYTICS_TOKEN"
          echo "token length:      ${#t}"
          echo "account id length: ${#CLOUDFLARE_ACCOUNT_ID}  (expect 32)"

          count() { printf '%s' "$t" | tr -cd "$1" | wc -c; }
          echo "lowercase a-z:     $(count 'a-z')"
          echo "uppercase A-Z:     $(count 'A-Z')"
          echo "digits 0-9:        $(count '0-9')"
          echo "dash and under:    $(count '_-')"

          # Which unexpected characters appear, not where or in what order. A
          # '.' points at a JWT, ':' or '=' at a key=value or header paste.
          other=$(printf '%s' "$t" | tr -d 'A-Za-z0-9_-' | fold -w1 | sort -u | tr -d '\n')
          if [ -n "$other" ]; then
            echo "other characters:  [$other]  <- not in the usual token alphabet"
          else
            echo "other characters:  none (alphanumeric plus - and _ only)"
          fi

          # Positive identification of the one credential type that cannot work
          # as a Bearer token, independent of any length assumption.
          if [[ "$t" =~ ^[0-9a-f]+$ ]]; then
            echo
            echo "All hex. Cloudflare's Global API Key is hex and does NOT"
            echo "authenticate as a Bearer token — that would explain code 1000."
            echo "An API Token from My Profile > API Tokens is the one to use."
          fi

      - name: Control — does the known-good deploy token verify here?
        env:
          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # deploy.yml ships the live site with CLOUDFLARE_API_TOKEN, so that
          # credential is known to work. Verifying it through this exact code
          # path answers the question measuring the string cannot: if the
          # deploy token verifies and the analytics one does not, the pipeline
          # is fine and the difference is the token itself.
          #
          # This only calls /user/tokens/verify. It reads nothing and changes
          # nothing, and the deploy token is not used for the query below.
          T=$(printf '%s' "$DEPLOY_TOKEN" | tr -d '[:space:]')
          if [ -z "$T" ]; then
            echo "CLOUDFLARE_API_TOKEN not readable here — control skipped."
            exit 0
          fi
          echo "::add-mask::$T"
          echo "deploy token length: ${#T}"
          curl -s https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer $T" > control.json
          python3 -c "
          import json
          d = json.load(open('control.json'))
          print('deploy token valid:', d.get('success'), '|',
                (d.get('result') or {}).get('status'),
                '|', [e.get('code') for e in (d.get('errors') or [])])
          "

      - name: Token check (advisory — does not gate the run)
        run: |
          # This step used to exit 1 on success:false and it was WRONG to.
          # /user/tokens/verify checks USER-owned tokens and answers 1000 for
          # anything it cannot find there — including this repo's deploy token,
          # which ships the live site on every push and fails this call. Five
          # runs died here on credentials that were never the problem.
          # The GraphQL query is the authoritative test; this is a note.
          curl -s https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer $CLOUDFLARE_ANALYTICS_TOKEN" > verify.json
          python3 - <<'PY'
          import json
          d = json.load(open('verify.json'))
          print('user-token verify:', d.get('success'),
                '|', (d.get('result') or {}).get('status'),
                '|', [e.get('code') for e in (d.get('errors') or [])])
          print('(advisory only — an account-owned token fails this and still works)')
          PY

      - name: Run
        run: |
          case "${{ inputs.command }}" in
            datasets)
              node cf-analytics.mjs datasets
              ;;
            fields)
              if [ -z "${{ inputs.dataset }}" ]; then
                echo "fields needs a dataset name — run 'datasets' first." >&2
                exit 1
              fi
              node cf-analytics.mjs fields "${{ inputs.dataset }}"
              ;;
            report)
              if [ -z "${{ inputs.dataset }}" ] || [ -z "${{ inputs.host_field }}" ] || [ -z "${{ inputs.country_field }}" ]; then
                echo "report needs dataset, host_field and country_field — run 'fields' first." >&2
                exit 1
              fi
              node cf-analytics.mjs report "${{ inputs.dataset }}" \
                --host "${{ inputs.host_field }}" \
                --country "${{ inputs.country_field }}" \
                --days "${{ inputs.days }}" \
                --exclude-ip "${{ inputs.exclude_ip }}" \
                --source "${{ inputs.source }}"
              ;;
            calibrate)
              # Reconciles every estimator against the unsampled daily rollup
              # in one run, because dispatches are serialized by the
              # concurrency group and each round-trip costs a minute.
              node cf-analytics.mjs calibrate --days "${{ inputs.days }}"
              ;;
            people)
              # Aggregates only — the command never prints an address, because
              # this log is public (Doctrine §9).
              node cf-analytics.mjs people \
                --days "${{ inputs.days }}" \
                --exclude-ip "${{ inputs.exclude_ip }}"
              ;;
            top-ips)
              # Never pass --full-ips here: this repository is public and the
              # run log is world-readable (Doctrine §9).
              node cf-analytics.mjs top-ips "${{ inputs.dataset || 'httpRequestsAdaptiveGroups' }}" \
                --host "${{ inputs.host }}" \
                --days "${{ inputs.days }}"
              ;;
          esac

      - name: What these numbers are not
        if: always()
        run: |
          # LESSONS.md §9 — the count includes machines. Say so every time rather
          # than letting a flattering number travel unqualified.
          echo "Requests are not visits, and this includes bots, scanners and crawlers."
          echo "Sanity-check composition before quoting any of it as usage:"
          echo "  - asset ratio: html far exceeding js/png means most hits never rendered"
          echo "  - protocol mix: HTTP/1.1 share is machine traffic; browsers use h2/h3"
